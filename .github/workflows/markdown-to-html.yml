name: Convert Markdown to HTML

on:
  push:
    branches:
      - main
    paths:
      - 'blog/posts/**/*.md'
      - '.github/workflows/markdown-to-html.yml'

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install markdown-folder-to-html
        run: npm install -g markdown-folder-to-html

      - name: Convert markdown files to HTML
        run: |
          echo "Starting markdown to HTML conversion..."
          for dir in blog/posts/*/; do
            if [ -d "$dir" ]; then
              echo "Converting markdown in $dir"
              mfth "$dir" "$dir" || exit 1
              echo "✓ Successfully converted $dir"
            fi
          done
          echo "Conversion complete!"

      - name: Check for converted files
        run: |
          echo "## Converted Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if find blog/posts -name "*.html" -type f | grep -q .; then
            echo "✓ HTML files generated:" >> $GITHUB_STEP_SUMMARY
            find blog/posts -name "*.html" -type f | sed 's/^/  - /' >> $GITHUB_STEP_SUMMARY
          else
            echo "✗ No HTML files found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit converted files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blog/posts/**/*.html
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "Convert markdown files to HTML"
            git push
            echo "✓ Successfully pushed converted files"
          fi
