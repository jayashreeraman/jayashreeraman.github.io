name: Convert Markdown to HTML

on:
  push:
    branches:
      - main
    paths:
      - 'blog/posts/**/*.md'
      - '.github/workflows/markdown-to-html.yml'

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install markdown packages
        run: npm install -g marked

      - name: Convert markdown files to HTML
        run: |
          node .github/scripts/markdown-to-html.js

      - name: Verify HTML files created
        run: |
          echo "## HTML Files Generated:" >> $GITHUB_STEP_SUMMARY
          if find blog/posts -name "*.html" -type f | grep -q .; then
            echo "✓ HTML files found:" >> $GITHUB_STEP_SUMMARY
            find blog/posts -name "*.html" -type f | sed 's/^/  - /' >> $GITHUB_STEP_SUMMARY
          else
            echo "✗ No HTML files generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push converted files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blog/posts/**/*.html || true
          
          if git diff --quiet --cached; then
            echo "ℹ No HTML changes to commit" >> $GITHUB_STEP_SUMMARY
          else
            git commit -m "Convert markdown files to HTML [skip ci]"
            git push origin main
            echo "✓ Successfully pushed converted HTML files" >> $GITHUB_STEP_SUMMARY
          fi
        <ul>
