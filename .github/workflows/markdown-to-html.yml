name: Convert Markdown to HTML

on:
  push:
    branches:
      - master
    paths:
      - 'blog/posts/md/**/*.md'
      - '.github/workflows/markdown-to-html.yml'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install markdown packages
        run: npm install marked

      - name: Convert markdown files to HTML
        run: |
          node << 'EOF'
          const marked = require('marked');
          const fs = require('fs');
          const path = require('path');

          function convertMarkdownToHtml(mdFilePath) {
            try {
              const markdown = fs.readFileSync(mdFilePath, 'utf-8');
              const html = marked.parse(markdown);
              const relativePath = path.relative('blog/posts/md', mdFilePath);
              const htmlDir = path.join('blog/posts/html', path.dirname(relativePath));
              const filename = path.basename(mdFilePath, '.md');
              const htmlFilePath = path.join(htmlDir, `j-${filename}.html`);
              
              if (!fs.existsSync(htmlDir)) {
                fs.mkdirSync(htmlDir, { recursive: true });
              }
              
              const relativeToRoot = path.relative(htmlDir, '.').replace(/\\/g, '/');
              const relativeToBlog = path.relative(htmlDir, 'blog').replace(/\\/g, '/');
              
              const template = '<!DOCTYPE html>\n<html>\n<head>\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <meta charset="utf-8">\n  <title>Blog Post</title>\n  <link rel="stylesheet" href="' + relativeToRoot + '/css/styles.css">\n</head>\n<body>\n  <div id="layout">\n    <a href="#menu" id="menuLink" class="menu-link"><span></span></a>\n    <nav id="menu">\n      <ul>\n        <li class="heading"><span>Main</span></li>\n        <ul>\n          <li><a href="' + relativeToRoot + '/index.html">Home</a></li>\n          <li><a href="' + relativeToBlog + '/index.html">Blog</a></li>\n        </ul>\n      </ul>\n    </nav>\n    <article id="main" class="content">\n      ' + html + '\n      <p><a href="' + relativeToBlog + '/index.html">← Back to Blog</a></p>\n    </article>\n  </div>\n  <script src="' + relativeToRoot + '/js/menu.js"><\/script>\n</body>\n</html>';
              
              fs.writeFileSync(htmlFilePath, template);
              console.log(`✓ Converted ${mdFilePath} → ${htmlFilePath}`);
            } catch (error) {
              console.error(`✗ Error converting ${mdFilePath}:`, error.message);
            }
          }

          function processDirectory(dir) {
            if (!fs.existsSync(dir)) {
              console.log(`Directory not found: ${dir}`);
              return;
            }
            const files = fs.readdirSync(dir);
            files.forEach(file => {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory()) {
                processDirectory(fullPath);
              } else if (file.endsWith('.md')) {
                convertMarkdownToHtml(fullPath);
              }
            });
          }

          console.log('Starting markdown to HTML conversion...');
          processDirectory('blog/posts/md');
          console.log('Conversion complete!');
          EOF

      - name: Verify HTML files created
        run: |
          echo "## HTML Files Generated:" >> $GITHUB_STEP_SUMMARY
          if find blog/posts/html -name "j-*.html" -type f | grep -q .; then
            echo "✓ HTML files found:" >> $GITHUB_STEP_SUMMARY
            find blog/posts/html -name "j-*.html" -type f | sed 's/^/  - /' >> $GITHUB_STEP_SUMMARY
          else
            echo "✗ No HTML files generated" >> $GITHUB_STEP_SUMMARY
            echo "Debug: Files in blog/posts/html:" >> $GITHUB_STEP_SUMMARY
            find blog/posts/html -type f | sed 's/^/  - /' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push converted files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blog/posts/html/**/j-*.html || true
          if git diff --quiet --cached; then
            echo "ℹ No HTML changes to commit" >> $GITHUB_STEP_SUMMARY
          else
            git commit -m "Convert markdown files to HTML [skip ci]"
            git push origin master
            echo "✓ Successfully pushed converted HTML files" >> $GITHUB_STEP_SUMMARY
          fi
