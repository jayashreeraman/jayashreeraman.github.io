<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <title>Jayashree's Knowledge Base</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* Sleek Blog Styles */
    body {
      background-color: #121212;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #f0f4f8;
    }
    .blog-container {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      max-width: 1100px;
    margin: 0;
    padding: 0;
    }
    .blog-main {
      flex: 1 1 100%;
      background: #1e1e1e;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .blog-main h1 {
      margin-top: 0;
      font-weight: 700;
      color: #b19cd9; /* Pastel Purple */
      font-size: 2.5rem;
    }
    .blog-main p {
      color: #a0aec0;
    }
    /* Filter & Controls Styles */
    .controls-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin: 2rem 0;
      gap: 1rem;
    }
    .filter-controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      flex: 1;
    }
    .search-input, .category-select {
      padding: 0.6rem 1rem;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #f0f4f8;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #2d2d2d;
    }
    .search-input {
      flex: 1;
      min-width: 200px;
      max-width: 300px;
    }
    .search-input:focus, .category-select:focus {
      border-color: #a2d2ff;
      box-shadow: 0 0 0 3px rgba(162, 210, 255, 0.2);
    }
    .view-toggle {
      display: flex;
      gap: 0.75rem;
    }
    .view-btn {
      background: #2d2d2d;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #a0aec0;
      font-weight: 500;
    }
    .view-btn:hover {
      background: #383838;
      color: #b19cd9;
      border-color: #666;
    }
    .view-btn.active {
      background: #a2d2ff;
      color: #121212;
      border-color: #a2d2ff;
      box-shadow: 0 2px 4px rgba(162, 210, 255, 0.2);
    }
    
    /* Sleek Cards */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .post-card, .post-item-list {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 1.5rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .post-card:hover, .post-item-list:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .post-item-list {
      margin-bottom: 1.5rem;
    }
    .post-card h3, .post-item-list h3 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.3rem;
      line-height: 1.4;
    }
    .post-card h3 a, .post-item-list h3 a {
      color: #a2d2ff; /* Pastel Blue */
      text-decoration: none;
    }
    .post-card h3 a:hover, .post-item-list h3 a:hover {
      color: #bde0fe;
    }
    .post-date {
      color: #8892b0;
      font-size: 0.85rem;
      display: block;
      margin-bottom: 1rem;
    }
    .post-excerpt {
      color: #d9e2ec;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .post-meta {
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .post-category {
      background: rgba(162, 210, 255, 0.15);
      color: #a2d2ff;
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .tag {
      color: #fdffb6; /* Pastel Yellow */
      font-size: 0.8rem;
      margin-right: 0.25rem;
      cursor: pointer;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      transition: color 0.2s ease, background-color 0.2s ease;
    }
    .tag:hover {
      color: #121212;
      background-color: #fdffb6;
    }
    .tag::before {
      content: '#';
      color: #718096;
    }
    .active-filters {
      margin-bottom: 1rem;
    }
    .clear-tag-btn {
      background: #333;
      border: none;
      border-radius: 20px;
      padding: 0.3rem 0.8rem;
      font-size: 0.85rem;
      color: #f0f4f8;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .clear-tag-btn:hover {
      background: #444;
      color: #b19cd9;
    }
    
    /* Pagination Styles */
    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 3rem;
    }
    .page-btn {
      background: #2d2d2d;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 0.5rem 0.8rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #a0aec0;
      font-weight: 500;
    }
    .page-btn:hover:not(:disabled) {
      background: #383838;
      color: #b19cd9;
      border-color: #666;
    }
    .page-btn.active {
      background: #a2d2ff;
      color: #121212;
      border-color: #a2d2ff;
      box-shadow: 0 2px 4px rgba(162, 210, 255, 0.2);
    }
    .page-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #1e1e1e;
    }
    
    /* Global overrides */
    #main.content {
      background-color: transparent;
      padding: 0 2rem;
      box-shadow: none;
      max-width: 1200px;
      margin: 50px 0; /* Aligns left instead of auto-centering */
    }
  </style>
</head>
<body>
  <div id="layout">
    <a href="#menu" id="menuLink" class="menu-link">
      <span></span>
    </a>
    <nav id="menu">
      <ul>
        <li class="heading"><span>Jayashree Raman</span></li>
        <ul>
          <li><a href="../index.html">Portfolio</a></li>
          <li><a class="active" href="./index.html">Knowledge Base</a></li>
        </ul>
      </ul>
    </nav>
    <article id="main" class="content">
      <div class="blog-container">
        <div class="blog-main">
          <h1>Jayashree's Knowledge Base</h1>
          <p>Welcome to my website tracking my learning expeditions. Browse posts by category below.</p>

          <div class="controls-container">
            <div class="filter-controls">
              <input type="text" id="searchInput" placeholder="Search posts..." class="search-input">
              <select id="categoryFilter" class="category-select">
                <option value="All">All Categories</option>
              </select>
            </div>
            <div class="view-toggle">
              <button id="listViewBtn" class="view-btn active" data-view="list">📋 List View</button>
              <button id="cardViewBtn" class="view-btn" data-view="card">🗂️ Card View</button>
            </div>
          </div>

          <div id="activeFilters" class="active-filters"></div>
          <div id="postsContainer" class="posts-list"></div>
          <div id="paginationContainer" class="pagination-container"></div>
        </div>
      </div>
    </article>
  </div>
  <script src="../js/menu.js"></script>
  <script>
    // Set base path for posts.json (with cache-buster to ensure fresh links)
    window.postsJsonPath = './posts.json?v=' + new Date().getTime();
  </script>
  <script src="../js/blog.js"></script>
</body>
</html>
