    async function loadUrbanPosts() {
      try {
        const response = await fetch('../../posts.json');
        const data = await response.json();
        posts = data.posts.filter(post => 
          post.category === 'Urban Planning' || 
          post.category === 'Urban Analytics' || 
          post.category === 'Urban Policy'
        );
        renderPosts();
      } catch (error) {
        console.error('Error loading posts:', error);
        posts = fallbackPosts.filter(post =>

          post.category === 'Urban Analytics' || 
          post.category === 'Urban Policy'
        );
        renderPosts();
      }
    }
    document.addEventListener('DOMContentLoaded', loadUrbanPosts);
